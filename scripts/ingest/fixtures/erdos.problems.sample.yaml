# Fixture: verbatim excerpt of the Erdős Problems ground-truth database.
#
# Source (canonical, per the repo README):
#   https://raw.githubusercontent.com/teorth/erdosproblems/main/data/problems.yaml
# Repo:    https://github.com/teorth/erdosproblems   (License: Apache-2.0, confirmed)
# Fetched: 2026-07-21 · full file: 1217 problems, 256 KB
# This excerpt is the first 12 problems, byte-for-byte from the source.
#
# CONFIRMED FIELD NAMES (read from the source, NOT assumed):
#   number      string   problem id, e.g. "1"           (quoted string, not int)
#   prize       string   "$500" | "$1000" | ... | "no"  (money or the literal "no")
#   status:                                              (nested object)
#     state         string   "open" | "proved" | "disproved" | "verifiable" | ...
#     last_update   string   ISO date "YYYY-MM-DD"
#   oeis        string[] OEIS ids, e.g. ["A276661"] or ["N/A"]   (optional)
#   formalized:                                          (nested object)
#     state         string   "yes" | "no"
#     last_update   string   ISO date
#   tags        string[] free-text subject tags, e.g. ["number theory", "primes"]
#   comments    string   OPTIONAL short label, e.g. "sunflower conjecture"
#                        (present on only 65/1217; max ~48 chars; a name, not a statement)
#
# CRITICAL: the YAML carries NO problem statement / question / description / title.
# It is an OEIS-linking metadata database. The prose statement of each problem
# lives only on erdosproblems.com/<number>, which is NOT in this repo and is a
# host the Atlas app loader does not approve. See ingest-2 report for the
# implications for the erdos adapter (Tasks 3–4).
#
